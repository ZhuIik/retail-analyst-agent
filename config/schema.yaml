# Static schema description. This is what the model sees: the *scoped* tables.
# `exposed: false` columns do not exist in the scoped tables at all (PII) — the model
# cannot select them, BigQuery would answer "Unrecognized name".
# `hashed: true` columns hold salted pseudonyms of customer ids: joins and
# COUNT(DISTINCT) work, real ids are never visible.
# `demographic: true` columns are allowed in aggregates only: a query grouping by them must
# count distinct customers, and groups below sql.min_group_size are hidden (k-anonymity).

tables:
  orders:
    description: One row per customer order that contains at least one of the user's products. Use order_items for money, units and product metrics.
    columns:
      order_id: {type: INTEGER, description: Order id; joins order_items.order_id}
      user_id: {type: STRING, hashed: true, description: "Customer pseudonym, e.g. C-3fa9b1c2d4e5; joins users.id"}
      status: {type: STRING, description: "Order status: Cancelled, Complete, Processing, Returned, Shipped"}
      gender: {type: STRING, description: Customer gender (M/F)}
      created_at: {type: TIMESTAMP, description: When the order was placed}
      returned_at: {type: TIMESTAMP}
      shipped_at: {type: TIMESTAMP}
      delivered_at: {type: TIMESTAMP}
      num_of_item: {type: INTEGER, exposed: false}  # counts items of all brands: would reveal other brands' baskets

  order_items:
    description: One row per item sold. The main table for revenue, units and product metrics.
    columns:
      id: {type: INTEGER, description: Order item id}
      order_id: {type: INTEGER, description: Joins orders.order_id}
      user_id: {type: STRING, hashed: true, description: "Customer pseudonym, e.g. C-3fa9b1c2d4e5; joins users.id"}
      product_id: {type: INTEGER, description: Joins products.id}
      inventory_item_id: {type: INTEGER}
      status: {type: STRING, description: "Item status: Cancelled, Complete, Processing, Returned, Shipped"}
      created_at: {type: TIMESTAMP, description: When the item was ordered}
      shipped_at: {type: TIMESTAMP}
      delivered_at: {type: TIMESTAMP}
      returned_at: {type: TIMESTAMP}
      sale_price: {type: FLOAT, description: Price the item was sold for (revenue)}

  products:
    description: Product catalog.
    columns:
      id: {type: INTEGER, description: Product id; joins order_items.product_id}
      cost: {type: FLOAT, description: Unit cost (margin = sale_price - cost)}
      category: {type: STRING, description: "26 categories, e.g. Jeans, Outerwear & Coats, Tops & Tees"}
      name: {type: STRING, description: Product name}
      brand: {type: STRING, description: "Brand (~2,700 values; look up exact spelling with describe_data)"}
      retail_price: {type: FLOAT, description: List price}
      department: {type: STRING, description: "Men or Women"}
      sku: {type: STRING}
      distribution_center_id: {type: INTEGER}

  users:
    description: Customers (only those who bought products in the user's scope). Personal data columns are removed.
    columns:
      id: {type: STRING, hashed: true, description: "Customer pseudonym, e.g. C-3fa9b1c2d4e5"}
      age: {type: INTEGER, demographic: true}
      gender: {type: STRING, demographic: true, description: M/F}
      state: {type: STRING, demographic: true}
      city: {type: STRING, demographic: true}
      country: {type: STRING, demographic: true}
      traffic_source: {type: STRING, demographic: true, description: "Acquisition channel, e.g. Search, Organic, Facebook, Email, Display"}
      created_at: {type: TIMESTAMP, description: Customer sign-up time}
      first_name: {type: STRING, exposed: false}
      last_name: {type: STRING, exposed: false}
      email: {type: STRING, exposed: false}
      street_address: {type: STRING, exposed: false}
      postal_code: {type: STRING, exposed: false}
      latitude: {type: FLOAT, exposed: false}
      longitude: {type: FLOAT, exposed: false}
      user_geom: {type: GEOGRAPHY, exposed: false}
