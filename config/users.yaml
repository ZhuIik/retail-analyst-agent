# Prototype stand-in for login: in production the frontend sends a JWT whose claims carry the
# user's brands, and the agent enforces access from them.
# Access is by brand (the client's rule); `column: null` means all products (the CEO).
# The code supports other access columns (category, department) as a config change.
# Brand-level data is thin in this dataset (median brand: ~12 items sold), so the demo users
# manage top-selling brands.

users:
  ceo:
    display_name: Chief Executive Officer
    role: ceo
    access:
      column: null
      values: []

  anna:
    display_name: Anna (Brand Manager)
    role: brand_manager
    access:
      column: brand
      values: ["Calvin Klein", "Diesel", "Carhartt"]

  mark:
    display_name: Mark (Brand Manager)
    role: brand_manager
    access:
      column: brand
      values: ["Levi's", "True Religion", "Columbia"]
