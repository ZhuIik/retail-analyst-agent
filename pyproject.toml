[project]
name = "retail-analyst"
version = "0.1.0"
description = "CLI data-analysis agent for retail executives over BigQuery thelook_ecommerce (Gemini + LangGraph)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=3.0",
    "google-cloud-bigquery>=3.25",
    "sqlglot>=26.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "langfuse>=3",
]

[project.scripts]
analyst = "retail_analyst.cli:main"
analyst-doctor = "retail_analyst.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs real Google Cloud credentials (BigQuery / Gemini); skipped otherwise"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
