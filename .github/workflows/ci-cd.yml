name: CI and CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -m 'not live'
      - name: Verify pip lock export
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Registry login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        id: build
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.name.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container startup smoke test (no Google credentials)
        env:
          IMAGE: ${{ steps.name.outputs.name }}:${{ github.sha }}
        run: |
          docker run -d --name smoke -p 127.0.0.1:8000:8000 \
            -e 'ANALYST_API_KEYS={"anna":"ci-only-key-with-at-least-32-characters"}' \
            -e ID_SALT=ci-only-private-salt "$IMAGE"
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: Verify deployment and automatic rollback
        env:
          IMAGE: ${{ steps.name.outputs.name }}:${{ github.sha }}
        run: bash tests/check_deploy.sh "$IMAGE"
      - name: Publish tested image
        id: ref
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.name }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy and verify (automatic rollback on failure)
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]*$ ]]
          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          scp "${ssh_options[@]}" -P "$VPS_PORT" deploy/compose.yaml deploy/compose.public.yaml deploy/Caddyfile deploy/deploy.sh deploy/registry-deploy.sh "$VPS_USER@$VPS_HOST:/opt/retail-analyst/"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash /opt/retail-analyst/registry-deploy.sh '$REGISTRY_USER' '$IMAGE'"
